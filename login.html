<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ron Options - Log In</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,Roboto,Arial,sans-serif; }
  body { background:linear-gradient(180deg,#0d0a1a,#1a1140); color:#fff; min-height:100vh; padding:24px 20px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:bold; font-size:18px; margin-bottom:24px; }
  .brand .logo { background:linear-gradient(135deg,#e91e8c,#7b2ff7); width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  h1 { font-size:24px; margin-bottom:6px; }
  .sub { color:#999; font-size:14px; margin-bottom:24px; }
  label { font-size:13px; color:#ccc; display:block; margin-bottom:6px; }
  .field-wrap { position:relative; margin-bottom:16px; }
  input { width:100%; padding:14px 14px 14px 40px; border-radius:8px; border:none; background:#fff; color:#111; font-size:14px; }
  .field-wrap .ic { position:absolute; left:12px; top:14px; color:#888; }
  .eye { position:absolute; right:12px; top:14px; color:#888; cursor:pointer; background:none;border:none; }
  .row { display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:20px; }
  .row a { color:#a855f7; text-decoration:none; }
  .signin-btn { width:100%; background:#7b2ff7; border:none; color:#fff; padding:14px; border-radius:10px; font-weight:bold; font-size:15px; }
  .signin-btn:disabled { opacity:0.7; }
  .footer-link { text-align:center; margin-top:20px; font-size:14px; color:#ccc; }
  .footer-link a { color:#a855f7; text-decoration:none; }
  .error { color:#f87171; font-size:13px; margin-bottom:12px; display:none; }
</style>
</head>
<body>

<div class="brand"><span class="logo">📈</span> Ron Options</div>
<h1>Welcome back</h1>
<div class="sub">Sign in to your account to continue</div>

<div class="error" id="errMsg">Invalid email or password.</div>

<label>Email</label>
<div class="field-wrap">
  <span class="ic">✉</span>
  <input type="email" id="email" placeholder="you@example.com">
</div>

<label>Password</label>
<div class="field-wrap">
  <span class="ic">🔒</span>
  <input type="password" id="password" placeholder="Enter your password">
  <button class="eye" onclick="togglePw()">👁</button>
</div>

<div class="row">
  <label style="display:flex;align-items:center;gap:6px;margin:0;">
    <input type="checkbox" style="width:auto;padding:0;"> Remember me
  </label>
  <a href="#" onclick="alert('Password reset link sent (demo)')">Forgot password?</a>
</div>

<button class="signin-btn" id="signinBtn" onclick="signIn()">Sign In</button>

<div class="footer-link">Don't have an account? <a href="signup.html">Create account</a></div>

<script>
function togglePw(){
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
}
function signIn(){
  const email = document.getElementById('email').value;
  const pw = document.getElementById('password').value;
  const btn = document.getElementById('signinBtn');
  const err = document.getElementById('errMsg');
  err.style.display = 'none';
  if(!email || !pw){
    err.textContent = 'Please fill in both fields.';
    err.style.display = 'block';
    return;
  }
  btn.textContent = 'Signing in...';
  btn.disabled = true;
  setTimeout(()=>{
    // demo auth: any non-empty fields succeed
    window.location.href = 'trade.html';
  }, 1200);
}
</script>
</body>
</html>
